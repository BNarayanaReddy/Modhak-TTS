# configs/data.yaml — data pipeline configuration (Phase 2).
# Values live here, not in code (GOAL coding standards). Rationale is in DECISIONS.md;
# docs/DATA.md points here. Confirmed data sources: 2026-09-24 (see RECON §7 / chat).

sources:
  primary_marathi:                 # domain signal (Decisions 7, 9)
    hf_path: SPRINGLab/IndicTTS_Marathi
    role: primary_training
    language_id: mr
    format: parquet
    gated: false
  voice_anchor:                    # anti-drift anchor (Decision 7)
    hf_path: ai4bharat/Rasa
    split: Marathi
    role: voice_anchor
    language_id: mr
    format: parquet
    gated: true                    # requires accepting terms on HF
  replay_hindi:                    # anti-forgetting (Decision 3): linguistically closest
    hf_path: SPRINGLab/IndicTTS-Hindi
    role: replay
    language_id: hi
    format: parquet
    gated: false
  replay_english:                  # anti-forgetting (Decision 3): backbone health
    hf_path: SPRINGLab/IndicTTS-English
    role: replay
    language_id: en
    format: parquet
    gated: false
  # NOTE: DATA.md §4 listed "IndicVoices-R Marathi" — no such public dataset exists
  # (only Hindi/Tamil). Dropped from the mixture (confirmed); reinforces Decision 9.

audio:
  target_sample_rate: 24000        # SNAC 24 kHz
  source_sample_rate_hint: 48000   # both SPRINGLab and Rasa ship 48 kHz → resample to target

# Speaker assignment (D15, operationalizes Decision 7). These corpora carry no speaker
# NAMES — only gender — so we map gender → the library's target voice for the language.
# Rasa Marathi F/M ARE the real Anagha/Chinmay studio recordings (genuine anchor); mapping
# SPRINGLab general Marathi onto the same two voices is Decision 7's accepted drift trade.
# Hindi retention uses Amit (matches the model card's API example). Style is NOT used for
# conditioning (Decision 6); Rasa's `style` column is kept only as eval-bucket metadata.
speaker_assignment:
  SPRINGLab/IndicTTS_Marathi: {by: gender_int, map: {0: Anagha, 1: Chinmay}}
  ai4bharat/Rasa:             {by: gender_str, map: {Female: Anagha, Male: Chinmay}}
  SPRINGLab/IndicTTS-Hindi:   {by: gender_int, map: {0: Kavya, 1: Amit}}
  SPRINGLab/IndicTTS-English: {by: fixed, voice: Amit}   # no gender column; cross-lingual English

# Per-batch mixture (fractions sum to 1.0). Derived from:
#   Decision 3: 20% non-Marathi replay = 15% Hindi + 5% English.
#   Decision 7: Rasa is 30% of the Marathi batch → within the 80% Marathi,
#               0.80*0.30 = 0.24 Rasa (anchor), 0.80*0.70 = 0.56 SPRINGLab (signal).
mixture:
  springlab_marathi: 0.56
  rasa_marathi:      0.24
  hindi_replay:      0.15
  english_replay:    0.05

gates:
  # HARD rejects (GOAL Phase 2) — clip is dropped.
  hard:
    require_known_license: true          # license 'unknown'/empty → reject
    duration_s: [0.5, 20.0]              # GOAL: outside this window → reject
    require_nonempty_normalized: true    # empty text_normalized → reject
    require_speaker_in_library: true     # speaker ∉ 44-voice roster → reject (Decision 1)
    reject_eval_bucket_audio_hash: true  # audio-hash collision with a locked eval clip → reject
  # SOFT filters — clip is down-weighted/flagged, thresholds tunable.
  soft:
    snr_floor_db: 15.0        # below this SNR → flag; 15 dB ≈ intelligible-but-noisy floor
    clipping_ratio_max: 0.01  # >1% full-scale samples → flag (likely distorted source)

# Dead-man's-switch (D15 tightening 3): a PRE-FLIGHT check on a per-source sample, run
# before the full compile. Trips (halts) rather than silently training the target voices on
# a degraded source. Thresholds set from the Phase-2 validation (Anagha/Chinmay ~90 dB SNR,
# 0% narrowband) — both current sources pass comfortably.
dead_mans_switch:
  sample_clips_per_source: 64
  min_median_snr_db: 20.0
  min_wideband_fraction: 0.90   # fraction of sampled clips with bandwidth ≥ wideband_floor_hz
  wideband_floor_hz: 6000.0

text_norm:
  normalizer_version: mr-norm-v1
  expand_numbers: false       # digits kept + TODO logged until indic_normalizer is wired
